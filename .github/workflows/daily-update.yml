name: Daily update caches

# 每天自动更新懂球帝（B队/U19新闻）与 Sofascore（U19/U18/U16）的缓存并提交，
# GitHub Pages 监听 main 分支，推送后自动重新部署，保证线上站点数据每日刷新。
# 触发时间：每天 16:23 UTC（北京时间次日 00:23，避开本机计划任务 09/15/21 点，防 git 撞车）。
# 注：U18/U16 步骤 continue-on-error —— Sofascore 对运行器 IP 有频率限制，
#     单个步骤失败不应阻断提交（否则线上永远停在旧数据）。
# 注：集锦主缓存（dqd-videos-cache.js）仍只由本机计划任务维护 —— 运行器抓不到 B站/微博
#     （国内源），且 scripts/bili-seen.txt 是本机专用去重状态（未入库）。
#     所以这里的集锦步骤用 -YouTubeOnly 模式：只产出一份独立分片
#     scripts/dqd-videos-yt-shard.js，由本机下一次运行时合并并清空。
#     分片与主缓存物理隔离，运行器那条代码路径不碰 dqd-videos-cache.js ——
#     结构上不可能覆盖本机抓到数据（不要改回直接跑全量模式）。

on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch: {}   # 也可在 Actions 页手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest          # Windows 运行器自带 Edge（Sofascore 反爬需要真浏览器指纹）
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Update B team cache (dongqiudi)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_barca_atletic.ps1

      - name: Update B team news (dongqiudi)
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_barca_news.ps1

      - name: Update U19 cache (Sofascore)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u19_sofascore.ps1

      - name: Update U19 news (dongqiudi)
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u19_news.ps1

      - name: Update U18 news (dongqiudi)
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u18_news.ps1

      - name: Update U16 news (dongqiudi)
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u16_news.ps1

      - name: Update official news (fcbarcelona.com)
        continue-on-error: true   # 官方站可能结构变化/网络不可达；失败不中断
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_fcb_news.ps1

      - name: Update Sport.es news
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_sport_news.ps1

      - name: Update Mundo Deportivo news
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_md_news.ps1

      - name: Update U18 cache (Sofascore)
        continue-on-error: true   # 失败不中断：保证下方提交步骤始终执行
        shell: powershell
        run: |
          Start-Sleep -Seconds 20   # 与上一步错峰，降低 Sofascore 频率限制
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u18_sofascore.ps1

      - name: Update U16 cache (Sofascore)
        continue-on-error: true   # 失败不中断：保证下方提交步骤始终执行
        shell: powershell
        run: |
          Start-Sleep -Seconds 20
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u16_sofascore.ps1

      - name: Update FCB youth schedules (cadete-a/b, infantil-a/b)
        continue-on-error: true   # 官方站可能风控/结构变化；失败不中断，下次自动重试
        shell: powershell
        run: |
          Start-Sleep -Seconds 20
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_fcb_youth_schedules.ps1

      - name: Update weekly album cache (飞翔的拉杆箱)
        continue-on-error: true   # 公众号合集页可能风控/结构变化；失败不中断
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_weekly_album.ps1

      # YouTube-only：本机无代理抓不到 YouTube，运行器在美区可直连。
      # 只产出独立分片 scripts/dqd-videos-yt-shard.js，不写主缓存（见文件头注释）。
      # 放在 Sofascore 步骤之后：A0 才能读到本次刚更新的赛程缓存。
      - name: Update YouTube shard (YouTube-only)
        continue-on-error: true
        timeout-minutes: 20
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_youtube.ps1 -YouTubeOnly

      - name: Commit updated caches
        shell: powershell
        run: |
          # 注意：本步骤脚本必须保持纯 ASCII（PowerShell 5.1 无 BOM 读中文会解析失败）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # checkout 默认可能停在 detached HEAD，确保回到 main 分支
          if (-not (git symbolic-ref -q HEAD)) { git checkout -B main }
          git add assets/js/dqd-barca-atletic-cache.js assets/js/dqd-barca-news-cache.js assets/js/dqd-u19-news-cache.js assets/js/dqd-u18-news-cache.js assets/js/dqd-u16-news-cache.js assets/js/lamasia-official-news-cache.js assets/js/sport-news-cache.js assets/js/md-news-cache.js assets/js/dqd-u19-cache.js assets/js/dqd-u18-cache.js assets/js/dqd-u16-cache.js assets/js/dqd-u19-details-cache.js assets/js/dqd-u18-details-cache.js assets/js/dqd-u16-details-cache.js assets/js/weekly-album-cache.js assets/js/fcb-youth-schedules.js assets/img/players/dqd scripts/one-time-channels.txt scripts/one-time-dump.txt scripts/dqd-videos-yt-shard.js
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No cache changes, skip commit"
          } else {
            git commit -m "chore: daily update dongqiudi/sofascore caches"
            git push origin main
          }
