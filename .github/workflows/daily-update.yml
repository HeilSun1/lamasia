name: Daily update caches

# 每天自动更新懂球帝（B队/U19新闻）与 Sofascore（U19/U18/U16）的缓存并提交，
# GitHub Pages 监听 main 分支，推送后自动重新部署，保证线上站点数据每日刷新。
# 触发时间：每天 01:07 UTC（北京时间 09:07，与 本机计划任务错峰）。
# 注：U18/U16 步骤 continue-on-error —— Sofascore 对运行器 IP 有频率限制，
#     单个步骤失败不应阻断提交（否则线上永远停在旧数据）。

on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch: {}   # 也可在 Actions 页手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest          # Windows 运行器自带 Edge（Sofascore 反爬需要真浏览器指纹）
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Update B team cache (dongqiudi)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_barca_atletic.ps1

      - name: Update B team news (dongqiudi)
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_barca_news.ps1

      - name: Update U19 cache (Sofascore)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u19_sofascore.ps1

      - name: Update U19 news (dongqiudi)
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u19_news.ps1

      - name: Update U18 cache (Sofascore)
        continue-on-error: true   # 失败不中断：保证下方提交步骤始终执行
        shell: powershell
        run: |
          Start-Sleep -Seconds 20   # 与上一步错峰，降低 Sofascore 频率限制
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u18_sofascore.ps1

      - name: Update U16 cache (Sofascore)
        continue-on-error: true   # 失败不中断：保证下方提交步骤始终执行
        shell: powershell
        run: |
          Start-Sleep -Seconds 20
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_u16_sofascore.ps1

      - name: Update YouTube highlights cache
        continue-on-error: true   # 免 API key（Edge 抓取 + 频道 RSS）；美区运行器可稳定访问 YouTube
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\update_youtube.ps1

      - name: Commit updated caches
        shell: powershell
        run: |
          # 注意：本步骤脚本必须保持纯 ASCII（PowerShell 5.1 无 BOM 读中文会解析失败）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # checkout 默认可能停在 detached HEAD，确保回到 main 分支
          if (-not (git symbolic-ref -q HEAD)) { git checkout -B main }
          git add assets/js/dqd-barca-atletic-cache.js assets/js/dqd-barca-news-cache.js assets/js/dqd-u19-news-cache.js assets/js/dqd-u19-cache.js assets/js/dqd-u18-cache.js assets/js/dqd-u16-cache.js assets/js/dqd-u19-details-cache.js assets/js/dqd-u18-details-cache.js assets/js/dqd-u16-details-cache.js assets/js/dqd-videos-cache.js assets/img/players/dqd scripts/one-time-channels.txt scripts/one-time-dump.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No cache changes, skip commit"
          } else {
            git commit -m "chore: daily update dongqiudi/sofascore caches"
            git push origin main
          }
